[project]
name = "eba-pillar3-extractor"
version = "0.1.0"
description = "CLI pipeline to extract normalized quantitative Pillar 3 disclosures from the EBA Pillar 3 Data Hub (EDAP)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.1.0",
    "httpx>=0.27.0",
    "pyarrow>=17.0.0",
    "pydantic>=2.9.0",
    "rich>=13.9.0",
    "typer>=0.12.0",
]

[project.scripts]
eba-p3dh = "eba_p3dh.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eba_p3dh"]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
]
